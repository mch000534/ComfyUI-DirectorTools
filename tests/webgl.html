<!doctype html><html><meta charset="utf-8"><title>Panorama renderer test</title><body>
<canvas id="view" width="41" height="27"></canvas>
<script type="module">
import { PanoramaRenderer } from '../web/lib/panorama_renderer.mjs';
import { sphericalUV } from '../web/lib/geometry.mjs';
const source = document.createElement('canvas');source.width=30;source.height=15;
const context=source.getContext('2d'),image=context.createImageData(30,15);
for(let y=0;y<15;y++)for(let x=0;x<30;x++) {
 const i=(y*30+x)*4;
 image.data[i]=Math.round((x+.5)/30*255);image.data[i+1]=Math.round((y+.5)/15*255);
 image.data[i+2]=((x+y)%2)*100;image.data[i+3]=255;
}
context.putImageData(image,0,0);
const canvas=document.querySelector('#view');
const renderer=new PanoramaRenderer(canvas);renderer.upload(source);
function cpuColor(u,v){
 const x=u*30-.5,y=v*15-.5,x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
 const color=[0,0,0];
 for(let iy=0;iy<2;iy++)for(let ix=0;ix<2;ix++) {
  const index=(Math.min(14,Math.max(0,y0+iy))*30+((x0+ix)%30+30)%30)*4;
  const weight=(ix?fx:1-fx)*(iy?fy:1-fy);
  for(let c=0;c<3;c++)color[c]+=image.data[index+c]*weight;
 }
 return color;
}
window.checkRenderer=()=>{
 let maxError=0;
 for(const [cx,cy,zoom,aspect,cameraHeight] of [[.5,.5,1,16/9,0],[0,.5,1,16/9,.8],[1,.5,1,16/9,-.8],[.93,.24,2,9/16,.4],[.1,.97,1,2.39,-.4]]) {
  renderer.render({cx,cy,zoom,aspect,cameraHeight},41,27);
  const pixels=new Uint8Array(41*27*4);
  renderer.gl.readPixels(0,0,41,27,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);
  for(const [x,y] of [[0,0],[20,13],[40,26],[11,7],[25,23]]) {
   const uv=sphericalUV(2*(x+.5)/41-1,2*(y+.5)/27-1,aspect,cx,cy,zoom,cameraHeight);
   const expected=cpuColor(uv.u,uv.v);
   const index=((26-y)*41+x)*4;
   for(let c=0;c<3;c++)maxError=Math.max(maxError,Math.abs(pixels[index+c]-expected[c]));
  }
 }
 renderer.destroy();return maxError;
};
window.rendererReady=true;
</script></body></html>
